server {
    listen 80;
    listen [::]:80;

    server_name simhp.my.id www.simhp.my.id;

    root /app/public;
    index index.php index.html;

    # Logging
    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # ── Cloudflare Flexible SSL ───────────────────────────────────────
    # Cloudflare → VPS pakai HTTP, tapi kita kasih tahu Laravel
    # bahwa request dari user sebetulnya HTTPS.
    # Header CF-Visitor dikirim Cloudflare saat request HTTPS.
    set $https_flag "";
    if ($http_x_forwarded_proto = "https") {
        set $https_flag "on";
    }
    if ($http_cf_visitor ~* '"scheme":"https"') {
        set $https_flag "on";
    }

    # ── Keamanan ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Gzip Compression ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ── Static Assets (cache agresif) ────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP Handler ───────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_METHOD $request_method;

        # Beritahu Laravel request adalah HTTPS (untuk Cloudflare Flexible)
        fastcgi_param HTTPS $https_flag;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

        # Timeout settings
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 300;
    }

    # ── Laravel Routes ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Blokir akses ke file sensitif ────────────────────────────────
    location ~ /\. {
        deny all;
    }
    location ~ /\.env {
        deny all;
    }
}
