services:
  # Laravel Application (pull dari Docker Hub)
  app:
    image: ${DOCKERHUB_USERNAME}/simhpsb-app:${APP_IMAGE_TAG:-latest}
    container_name: simhpsb_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - app_public:/app/public
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - TZ=Asia/Jakarta
    networks:
      - simhpsb_network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: simhpsb_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
      - ./simhpsb_db.sql:/docker-entrypoint-initdb.d/init.sql
    # Port TIDAK di-expose ke luar — akses hanya via internal network
    networks:
      - simhpsb_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 5s

  # Redis (tidak expose port ke publik)
  redis:
    image: redis:7-alpine
    container_name: simhpsb_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    # Port TIDAK di-expose ke luar
    networks:
      - simhpsb_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      timeout: 5s
      retries: 10
      interval: 3s

  # Nginx — HTTP saja (SSL di-handle Cloudflare)
  nginx:
    image: nginx:alpine
    container_name: simhpsb_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app_public:/app/public
      - app_storage:/app/storage
      - ./docker/nginx/conf.d/production.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - simhpsb_network

networks:
  simhpsb_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  redis_data:
    driver: local
  app_public:
    driver: local
  app_storage:
    driver: local
